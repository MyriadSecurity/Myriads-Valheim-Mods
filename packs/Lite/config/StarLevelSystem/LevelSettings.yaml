#################################################
# Star Level System Expanded - Vanilla Baseline
#
# Server authoritative: install this on the server or hosting player.
# Level 1 = no stars; level 2 = one star; level 3 = two stars.
# BiomeMaxLevelOverride is a STAR cap, so 2 permits game level 3.
#
# Vanilla's normal 10% roll per promotion produces:
#   90% no stars, 9% one star, 1% two stars, where two stars are allowed.
# SLS uses ONE roll against cumulative chances to roll PAST each level:
#   1: 10 means 10% reach level 2 or higher.
#   2: 1 means 1% reach level 3.
#   3: 0 prevents further promotion.
#
# These are the normal vanilla baseline odds. For vanilla creature-specific
# star eligibility, distance gates and world difficulty modifiers, also set
# ControlSpawnerLevels = false in MidnightsFX.StarLevelSystem.cfg.
# Disable SLS distance, zone and Nemesis bonuses in that file as well.
#
# Health: 1x / 2x / 3x at 0 / 1 / 2 stars.
# Damage: 1x / 1.5x / 2x at 0 / 1 / 2 stars.
# No added speed, attack speed, size, resistance or spawn-rate bonuses.
#################################################

DefaultCreatureLevelUpChance:
  1: 10
  2: 1
  3: 0

# Bosses remain at level 1, with no stars.
BossCreatureLevelUpChance:
  1: 0

# No generated curves replace the explicit chance tables.
CustomLevelupGenerators: {}
DefaultLevelupGenerators: []
DefaultLevelupGeneratorRefs: []
BossLevelupGenerators: []
BossLevelupGeneratorRefs: []
LevelupChanceTablesBySpan: {}

# No extra chance bonuses with distance or defeated bosses.
EnableDistanceLevelBonus: false
DistanceLevelBonus: {}
EnableConditionalCreatureLevelupChance: false
ConditionalCreatureLevelupChance: {}
ConditionalBossKeyOrder: []

BiomeConfiguration:
  All:
    BiomeMaxLevelOverride: 2
    DistanceScaleModifier: 1.0
    SpawnRateModifier: 1.0
    DamageReceivedModifiers: {}
    CreatureBaseValueModifiers:
      BaseHealth: 1.0
      BaseDamage: 1.0
      Speed: 1.0
      AttackSpeed: 1.0
      Size: 1.0
    CreaturePerLevelValueModifiers:
      HealthPerLevel: 1.0
      DamagePerLevel: 0.5
      SpeedPerLevel: 0.0
      AttackSpeedPerLevel: 0.0
      SizePerLevel: 0.0
    NightSettings:
      SpawnRateModifier: 1.0
      NightLevelUpChanceScaler: 1.0
      CreatureSpawnsDisabled: []
  Meadows:
    BiomeMaxLevelOverride: 2
  BlackForest:
    BiomeMaxLevelOverride: 2
  Swamp:
    BiomeMaxLevelOverride: 2
  Mountain:
    BiomeMaxLevelOverride: 2
  Plains:
    BiomeMaxLevelOverride: 2
  Mistlands:
    BiomeMaxLevelOverride: 2
  AshLands:
    BiomeMaxLevelOverride: 2
  DeepNorth:
    BiomeMaxLevelOverride: 2

# Use the baseline above, without creature-specific SLS changes.
CreatureConfiguration: {}
