## The values set in this config file are the GLOBAL defaults for each ward placed. Admins and owners (when allowed) can change the individual ward configurations per ward [Not Synced with Server]
# Setting type: String
# Default value: 
Information about this config file = 

[Bubble]

## meters either side of a ward edge where its ground ring appears, whether or not the bubble or the ward's own marker are switched on. Zero turns this off. [Not Synced with Server]
# Setting type: Single
# Default value: 8
Boundary Ring = 8

## Draw ward bubbles at all. Off gives you the ward with no dome. [Not Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Enabled = On

## Overall strength of the bubble skin. [Not Synced with Server]
# Setting type: Single
# Default value: 1
Opacity = 1

## Rim brightness where the bubble curves away from you. [Not Synced with Server]
# Setting type: Single
# Default value: 0.9
Edge Glow = 0.9

## How tightly the rim glow hugs the silhouette. Higher is a thinner edge. [Not Synced with Server]
# Setting type: Single
# Default value: 2.5
Edge Falloff = 2.5

## How strongly the glass tints whatever you see through it. [Not Synced with Server]
# Setting type: Single
# Default value: 0.45
Base Tint = 0.45

## How much neighbouring bubbles melt into each other. [Not Synced with Server]
# Setting type: Single
# Default value: 1
Merge = 1

## How wide the colour crossfade is where two bubbles meet. Lower blends further. [Not Synced with Server]
# Setting type: Single
# Default value: 0.6
Merge Colour Blend = 0.6

## How hard the bubble bends whatever is behind it. [Not Synced with Server]
# Setting type: Single
# Default value: 1
Refraction = 1

## How far away bubbles still draw. [Not Synced with Server]
# Setting type: Single
# Default value: 120
Draw Distance = 120

## Softens the bubble where it meets terrain instead of cutting a hard line. [Not Synced with Server]
# Setting type: Single
# Default value: 3
Depth Fade = 3

## Size of the shimmer pattern on the skin. [Not Synced with Server]
# Setting type: Single
# Default value: 0.05
Shimmer Scale = 0.05

## How fast the shimmer drifts. [Not Synced with Server]
# Setting type: Single
# Default value: 0.08
Shimmer Speed = 0.08

## How visible the shimmer is. [Not Synced with Server]
# Setting type: Single
# Default value: 0.1
Shimmer Strength = 0.1

## meters per second the bubble grows or shrinks into a new radius. [Not Synced with Server]
# Setting type: Single
# Default value: 6
Expand Speed = 6

## How far a hit physically deforms the skin. [Not Synced with Server]
# Setting type: Single
# Default value: 1.2
Ripple Amount = 1.2

## How fast a hit ripple travels across the bubble. [Not Synced with Server]
# Setting type: Single
# Default value: 14
Ripple Speed = 14

## Thickness of the ripple ring. [Not Synced with Server]
# Setting type: Single
# Default value: 2.5
Ripple Width = 2.5

## How long a hit ripple lasts. [Not Synced with Server]
# Setting type: Single
# Default value: 1.4
Ripple Duration = 1.4

## How much the ripple thickens the skin as it passes. [Not Synced with Server]
# Setting type: Single
# Default value: 2
Ripple Opacity = 2

## Extra light the ripple throws off. [Not Synced with Server]
# Setting type: Single
# Default value: 1
Ripple Glow = 1

## Size of the idle swell across the skin. Lower is broader. [Not Synced with Server]
# Setting type: Single
# Default value: 0.25
Wave Scale = 0.25

## How fast the idle swell rolls. Slow keeps the edge readable. [Not Synced with Server]
# Setting type: Single
# Default value: 0.3
Wave Speed = 0.3

## How far the skin bulges while idle. Keep this small so the ward edge stays easy to read. Zero gives a still sphere. [Not Synced with Server]
# Setting type: Single
# Default value: 0.05
Wave Amount = 0.05

## Size of the swirling distortion in the skin pattern. [Not Synced with Server]
# Setting type: Single
# Default value: 0.03
Curl Scale = 0.03

## How much the swirl warps the skin pattern. [Not Synced with Server]
# Setting type: Single
# Default value: 6
Curl Strength = 6

## How wide the glowing band is where the bubble cuts into terrain. Narrow bands flicker over grass, so give it some room. [Not Synced with Server]
# Setting type: Single
# Default value: 2.5
Ground Contact Width = 2.5

## Brightness of that band. Zero gives you the plain hard edge. [Not Synced with Server]
# Setting type: Single
# Default value: 1.1
Ground Contact Glow = 1.1

## Texels either side the bubble looks past when measuring how close the ground is. Stops swaying grass strobing the contact band. Zero turns it off. [Not Synced with Server]
# Setting type: Single
# Default value: 2
Ground Contact Steadiness = 2

## Raymarch steps per pixel. Drop it if bubbles cost you frames, but too few and the skin shimmers. [Not Synced with Server]
# Setting type: Int32
# Default value: 96
Quality = 96

## How close a ray must get before it counts as touching the skin. Loose values make the edge crawl and shake. Vanilla shield generators use 0.001. [Not Synced with Server]
# Setting type: Single
# Default value: 0.002
Surface Precision = 0.002

## How far apart the surface angle is sampled. Higher smooths out shimmer at the cost of fine detail. [Not Synced with Server]
# Setting type: Single
# Default value: 0.1
Surface Smoothing = 0.1

